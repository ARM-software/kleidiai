default_install_hook_types: [ pre-commit, pre-push ]
fail_fast: false
repos:
  - repo: https://github.com/fsfe/reuse-tool
    # v5.0.2
    rev: 920b64419e8e15e2e60818d3d473f8a110b97e87
    hooks:
      - id: reuse-lint-file
        stages: [ pre-commit ]
        name: "REUSE Compliant Copyright and License"
        args: [ "--no-multiprocessing", "lint-file" ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # v4.5.0
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b
    hooks:
      - id: check-added-large-files
        args: [ '--maxkb=200', '--enforce-all' ]
        exclude: '(third_party/.*\.zip$|^experimental/ops/)'
        stages: [ pre-commit ]
        name: "File size limit not exceeded"
      - id: check-added-large-files
        stages: [ pre-commit ]
        name: File size limit not exceeded (experimental/ops/, 300kb)
        args: [ '--maxkb=300', '--enforce-all' ]
        files: ^experimental/ops/
      - id: check-yaml
        stages: [ pre-commit ]
        name: "YAML Syntax"
        exclude: ^\.clang-format$
      - id: trailing-whitespace
        stages: [ pre-commit ]
        exclude: ^LICENSES/

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    # 2.7.3
    rev: 2b74735540f79457a50369e5c17a2c35d52c3298
    hooks:
      - id: editorconfig-checker
        alias: ec
        stages: [ pre-commit ]
        name: "EditorConfig Rules"
        exclude: ^LICENSES/
  - repo: https://github.com/cmake-lint/cmake-lint
    rev: 251239e56ab8b88889fec16a47376c44dfa16a99
    hooks:
      - id: cmakelint
        stages: [ pre-commit ]
        name: CMake Linter
        exclude: ^experimental/ops/
      - id: cmakelint
        stages: [ pre-commit ]
        name: CMake Linter (experimental/ops/, no indent)
        files: ^experimental/ops/
        args: [--filter=-whitespace/indent]
  - repo: https://github.com/executablebooks/mdformat
    # 0.7.17
    rev: 6c1288142f351100fb24babd44aedd20e1599e99
    hooks:
      - id: mdformat
        stages: [ pre-commit ]
        name: Markdown Formatter
  - repo: https://github.com/pre-commit/mirrors-clang-format
    # v17.0.6
    rev: 05241dc3def184dba136e62d54ff57f1c8a497a9
    hooks:
      - id: clang-format
        stages: [ pre-commit ]
        name: "C/C++: clang-format Formatter"
        exclude: '^experimental/ops/'
  - repo: https://github.com/asottile/reorder-python-imports
    # v3.12.0
    rev: ae11ccbd838e90f7e2a16abbed9276e6a41cafbb
    hooks:
      - id: reorder-python-imports
        stages: [ pre-commit ]
        name: "Python: Reorder Imports"
        exclude: '^experimental/ops/'
  - repo: https://github.com/psf/black
    # 24.2.0
    rev: 6fdf8a4af28071ed1d079c01122b34c5d587207a
    hooks:
      - id: black
        stages: [ pre-commit ]
        name: "Python: Black Formatter"
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 5595ecae0b38f9450b7dddf00591c8591a9939bc
    hooks:
      - id: buildifier
        name: "Bazel: Buildifier (fix)"
        stages: [ pre-commit ]
      - id: buildifier-lint
        name: "Bazel: Buildifier (lint)"
        stages: [ pre-commit ]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    # v0.10.0.1
    rev: a23f6b85d0fdd5bb9d564e2579e678033debbdff
    hooks:
      - id: shellcheck
        stages: [ pre-commit ]
        args: [ "--severity=warning" ]
  - repo: local
    hooks:
      - id: signed-off-checker
        alias: signed-off-checker
        name: "Signed-off Checker (DCO)"
        entry: python tools/pre-commit/signedoff_checker.py
        always_run: true
        language: python
        language_version: python3
        description: Ensures that latest commit has been signed-off with `--signoff`.
        pass_filenames: false
        stages: [ pre-commit, pre-push ]
